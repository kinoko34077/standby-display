<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>standby-display browser geometry verification</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #result { display: none; }
  </style>
</head>
<body>
  <iframe id="fixture" title="geometry fixture"></iframe>
  <pre id="result" data-status="running"></pre>
  <script>
    const FONT_CASES = [
      { id: "d7", family: "DSEG7-Modern", weight: 400 },
      { id: "dseg7-classic-mini-bold", family: "DSEG7-Classic-MINI", weight: 700 },
      { id: "rajdhani", family: "Rajdhani", weight: 500 },
      { id: "mono", family: "IBM Plex Mono", weight: 400 },
    ];

    const params = new URLSearchParams(location.search);
    const suite = params.get("suite") || "landscape";
    const fixture = document.getElementById("fixture");
    const result = document.getElementById("result");
    const failures = [];
    const measurements = [];

    function fail(message, detail = {}) {
      failures.push({ message, ...detail });
    }

    function nearly(value, expected, tolerance, label, detail = {}) {
      if (!Number.isFinite(value) || Math.abs(value - expected) > tolerance) {
        fail(label, { value, expected, tolerance, ...detail });
      }
    }

    function transformedScale(element) {
      const transform = getComputedStyle(element).transform;
      if (!transform || transform === "none") return 1;
      const matrix = new DOMMatrixReadOnly(transform);
      return Math.hypot(matrix.a, matrix.b);
    }

    function inkBounds(element, scale) {
      const text = element.textContent || "";
      const rect = element.getBoundingClientRect();
      if (!text) return { left: rect.left, right: rect.left };

      const style = getComputedStyle(element);
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      context.font = [
        style.fontStyle,
        style.fontWeight,
        style.fontSize,
        style.fontFamily,
      ].join(" ");
      const metrics = context.measureText(text);
      const letterSpacing = Number.parseFloat(style.letterSpacing) || 0;
      const layoutWidth = rect.width / scale;
      const extraAdvance = layoutWidth - metrics.width;
      const characterCount = [...text].length;
      const measuredSlots =
        letterSpacing === 0
          ? 0
          : Math.max(0, Math.round(extraAdvance / letterSpacing));
      const precedingSpacingSlots = Math.min(
        measuredSlots,
        Math.max(0, characterCount - 1),
      );
      const left = rect.left - metrics.actualBoundingBoxLeft * scale;
      const right =
        rect.left +
        (metrics.actualBoundingBoxRight +
          precedingSpacingSlots * letterSpacing) *
          scale;
      return { left, right };
    }

    async function loadFixture(query) {
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("fixture load timeout")), 12000);
        fixture.onload = () => {
          clearTimeout(timer);
          resolve();
        };
        fixture.src = "../?" + query.toString();
      });

      const win = fixture.contentWindow;
      const doc = fixture.contentDocument;
      await doc.fonts.ready;
      await new Promise((resolve) =>
        win.requestAnimationFrame(() => win.requestAnimationFrame(resolve)),
      );
      return { win, doc };
    }

    function measurePrimary(doc) {
      const block = doc.querySelector(".clock-block");
      const hour = doc.getElementById("hour");
      const colon = doc.querySelector(".colon");
      const minute = doc.getElementById("minute");
      const scale = transformedScale(block);
      const bounds = [hour, colon, minute]
        .filter((element) => element && element.textContent)
        .map((element) => inkBounds(element, scale));
      return {
        scale,
        left: Math.min(...bounds.map((entry) => entry.left)),
        right: Math.max(...bounds.map((entry) => entry.right)),
      };
    }

    async function runCase(font, extra = {}) {
      const query = new URLSearchParams({
        clockfont: font.id,
        weather: "0",
        moon: "0",
        rokuyo: "0",
        bg: "000000",
        text: "000000",
        clock: "ff0000",
        dr: "0",
        sec: extra.seconds === false ? "0" : "1",
        timesys: extra.timeSystem || "civil",
        clocksize: String(extra.size ?? 100),
        clockspacing: String(extra.spacing ?? 0),
      });
      const { win, doc } = await loadFixture(query);
      const fontLoaded = doc.fonts.check(
        font.weight + ' 64px "' + font.family + '"',
      );
      if (!fontLoaded) {
        fail("font failed to load", { suite, font: font.id, family: font.family });
      }

      const primary = measurePrimary(doc);
      const visibleCenter = (primary.left + primary.right) / 2;
      const viewportCenter = win.innerWidth / 2;
      nearly(
        visibleCenter,
        viewportCenter,
        2.5,
        "primary visible-ink center drifted",
        {
          suite,
          font: font.id,
          size: extra.size ?? 100,
          spacing: extra.spacing ?? 0,
          visibleCenter,
          viewportCenter,
        },
      );

      const timeLine = doc.querySelector(".time-line").getBoundingClientRect();
      const seconds = doc.getElementById("seconds");
      if (extra.seconds !== false && !seconds.hidden) {
        const secondsRect = seconds.getBoundingClientRect();
        nearly(
          secondsRect.right,
          timeLine.right,
          1.5,
          "secondary seconds lost right-edge anchor",
          { suite, font: font.id },
        );
        if (secondsRect.top < timeLine.bottom - 1.5) {
          fail("secondary seconds overlap primary line", {
            suite,
            font: font.id,
            secondsTop: secondsRect.top,
            primaryBottom: timeLine.bottom,
          });
        }
      }

      if (extra.timeSystem === "hex-day") {
        const prefix = doc.getElementById("clock-prefix");
        prefix.style.opacity = "1";
        const prefixBounds = inkBounds(prefix, primary.scale);
        const hourBounds = inkBounds(doc.getElementById("hour"), primary.scale);
        const gap = hourBounds.left - prefixBounds.right;
        if (!(gap >= -1 && gap <= 10)) {
          fail("complete-hex prefix is detached or overlapping", {
            suite,
            font: font.id,
            gap,
          });
        }
        nearly(
          visibleCenter,
          viewportCenter,
          2.5,
          "complete-hex prefix moved the centered digit run",
          { suite, font: font.id, gap },
        );
      }

      measurements.push({
        suite,
        font: font.id,
        size: extra.size ?? 100,
        spacing: extra.spacing ?? 0,
        timeSystem: extra.timeSystem || "civil",
        centerError: visibleCenter - viewportCenter,
      });
    }

    async function main() {
      for (const font of FONT_CASES) {
        await runCase(font);
        await runCase(font, { timeSystem: "hex-day" });
      }

      for (const font of [FONT_CASES[0], FONT_CASES[3]]) {
        await runCase(font, { size: 60, spacing: -0.25 });
        await runCase(font, { size: 140, spacing: 0.25 });
      }

      const expectedPortrait = suite === "portrait";
      const actualPortrait =
        fixture.contentWindow.matchMedia("(max-aspect-ratio: 1 / 1)").matches;
      if (expectedPortrait !== actualPortrait) {
        fail("requested viewport orientation was not applied", {
          suite,
          expectedPortrait,
          actualPortrait,
          width: fixture.contentWindow.innerWidth,
          height: fixture.contentWindow.innerHeight,
        });
      }

      result.dataset.status = failures.length === 0 ? "pass" : "fail";
      result.textContent = JSON.stringify({ suite, failures, measurements });
      document.title = failures.length === 0 ? "PASS" : "FAIL";
    }

    main().catch((error) => {
      result.dataset.status = "fail";
      result.textContent = JSON.stringify({
        suite,
        failures: [{ message: error.message, stack: error.stack }],
        measurements,
      });
      document.title = "FAIL";
    });
  </script>
</body>
</html>
