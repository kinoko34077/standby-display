<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>和風スタンバイ時計</title>
    <meta
      name="description"
      content="和暦表示、正刻、時辰、天気、月齢、六曜をまとめて表示する和風スタンバイ時計です。"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="和風スタンバイ時計" />
    <meta
      property="og:description"
      content="和暦表示、正刻、時辰、天気、月齢、六曜をまとめて表示する和風スタンバイ時計です。"
    />
    <meta
      property="og:url"
      content="https://kinoko34077.github.io/standby-display/"
    />
    <meta
      property="og:image"
      content="https://kinoko34077.github.io/standby-display/icon-192.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="和風スタンバイ時計" />
    <meta
      name="twitter:description"
      content="和暦表示、正刻、時辰、天気、月齢、六曜をまとめて表示する和風スタンバイ時計です。"
    />
    <meta
      name="twitter:image"
      content="https://kinoko34077.github.io/standby-display/icon-192.png"
    />
    <link rel="manifest" href="./manifest.json" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Rajdhani:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-writing-mode="horizontal" data-settings-open="false">
    <main class="main-layout">
      <section class="date-panel">
        <div class="block date-block">
          <div id="wareki-line1">和暦某年</div>
          <div id="wareki-line2">某月某日曜</div>
        </div>
      </section>

      <section class="clock-panel" aria-label="現在時刻">
        <div class="block clock-block">
          <div class="time-line">
            <span id="hour">88</span><span class="colon">:</span
            ><span id="minute">88</span>
          </div>
          <div class="seconds" id="seconds">:88</div>
        </div>
      </section>

      <section class="extra-panel">
        <div class="info-line">
          <span class="seikoku">辰幾つ</span>
          <span class="weather" id="weather">88℃</span>
        </div>
        <div class="info-line">
          <span class="jishin">幾つ</span>
          <span class="supplemental-pair">
            <span class="moon-phase" id="moon-phase">🌑</span><span class="rokuyo" id="rokuyo">六曜</span>
          </span>
        </div>
      </section>
    </main>

    <div class="settings-trigger-layer">
      <button
        id="settings-open"
        class="settings-trigger"
        type="button"
        aria-label="設定"
        title="設定"
      >
        <img
          src="./assets/settings-trigger.png"
          class="settings-trigger-image"
          alt=""
          aria-hidden="true"
          width="32"
          height="32"
          decoding="async"
        />
      </button>
    </div>

    <div
      id="settings-overlay"
      class="settings-overlay"
      data-view="fullscreen"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
      hidden
    >
      <div class="settings-shell">
        <header class="settings-toolbar">
          <div class="settings-toolbar-title">
            <h1 id="settings-title">設定</h1>
            <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
          </div>
          <div class="settings-toolbar-actions">
            <button
              id="settings-view-toggle"
              class="toolbar-button"
              type="button"
              aria-label="部分表示へ切替"
            >
              部分
            </button>
            <button
              id="settings-close"
              class="toolbar-icon-button"
              type="button"
              aria-label="閉じる"
              title="閉じる"
            >
              <span aria-hidden="true">✕</span>
            </button>
          </div>
        </header>

        <div class="settings-grid">
          <section class="settings-section">
            <h2>時計設定</h2>

            <label class="control-row">
              <span class="control-label">秒表示</span>
              <span class="switch">
                <input id="setting-clock-seconds" type="checkbox" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
            </label>

            <div class="control-row">
              <span class="control-label">時間形式</span>
              <div class="segmented-control" role="radiogroup" aria-label="時間形式">
                <label class="segment">
                  <input type="radio" name="hour-format" value="24" />
                  <span>24時間</span>
                </label>
                <label class="segment">
                  <input type="radio" name="hour-format" value="12" />
                  <span>12時間</span>
                </label>
              </div>
            </div>

            <label class="control-row control-row-select">
              <span class="control-label">時計フォント</span>
              <select id="setting-clock-font" class="select-control" aria-label="時計フォント"></select>
            </label>
          </section>

          <section class="settings-section">
            <h2>表記設定</h2>

            <div class="control-row">
              <span class="control-label">年表示</span>
              <div class="segmented-control" role="radiogroup" aria-label="年表示">
                <label class="segment">
                  <input type="radio" name="year-system" value="wareki" />
                  <span>和暦</span>
                </label>
                <label class="segment">
                  <input type="radio" name="year-system" value="western" />
                  <span>西暦</span>
                </label>
              </div>
            </div>

            <div class="control-row">
              <span class="control-label">字体</span>
              <div class="segmented-control" role="radiogroup" aria-label="字体">
                <label class="segment">
                  <input type="radio" name="character-style" value="new" />
                  <span>新字体</span>
                </label>
                <label class="segment">
                  <input type="radio" name="character-style" value="old" />
                  <span>旧字体</span>
                </label>
              </div>
            </div>

            <div class="control-row">
              <span class="control-label">書字方向</span>
              <div class="segmented-control" role="radiogroup" aria-label="書字方向">
                <label class="segment">
                  <input type="radio" name="writing-mode" value="horizontal" />
                  <span>横書き</span>
                </label>
                <label class="segment">
                  <input type="radio" name="writing-mode" value="vertical" />
                  <span>縦書き</span>
                </label>
              </div>
            </div>

            <label class="control-row control-row-select">
              <span class="control-label">日本語フォント</span>
              <select id="setting-text-font" class="select-control" aria-label="日本語フォント"></select>
            </label>
          </section>

          <section class="settings-section">
            <h2>表示情報</h2>

            <label class="control-row">
              <span class="control-label">天気</span>
              <span class="switch">
                <input id="setting-visibility-weather" type="checkbox" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
            </label>

            <label class="control-row">
              <span class="control-label">月齢</span>
              <span class="switch">
                <input id="setting-visibility-moon" type="checkbox" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
            </label>

            <label class="control-row">
              <span class="control-label">六曜</span>
              <span class="switch">
                <input id="setting-visibility-rokuyo" type="checkbox" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
            </label>
          </section>

          <section class="settings-section">
            <h2>色設定</h2>

            <label class="control-row color-row">
              <span class="control-label">背景色</span>
              <span class="color-control">
                <div id="color-picker-background" class="color-picker" aria-label="背景色を選択"></div>
                <input id="setting-color-background" class="native-color-input" type="color" aria-label="背景色" />
                <output id="setting-color-background-value" class="color-value">#000000</output>
              </span>
            </label>

            <label class="control-row color-row">
              <span class="control-label">文字色</span>
              <span class="color-control">
                <div id="color-picker-text" class="color-picker" aria-label="文字色を選択"></div>
                <input id="setting-color-text" class="native-color-input" type="color" aria-label="文字色" />
                <output id="setting-color-text-value" class="color-value">#ffffff</output>
              </span>
            </label>

            <label class="control-row color-row">
              <span class="control-label">時計色</span>
              <span class="color-control">
                <div id="color-picker-clock" class="color-picker" aria-label="時計色を選択"></div>
                <input id="setting-color-clock" class="native-color-input" type="color" aria-label="時計色" />
                <output id="setting-color-clock-value" class="color-value">#70b8ff</output>
              </span>
            </label>
          </section>

          <section class="settings-section random-colors-section">
            <h2>毎日のランダム色</h2>
            <p class="settings-help">
              有効にすると、日付ごとに時計色と文字色を安定したランダム値へ変更します。背景色は別スイッチで変更できます。
            </p>

            <label class="control-row">
              <span class="control-label">毎日ランダム</span>
              <span class="switch">
                <input id="setting-random-colors" type="checkbox" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
            </label>

            <label class="control-row">
              <span class="control-label">背景色も変更</span>
              <span class="switch">
                <input id="setting-random-background" type="checkbox" />
                <span class="switch-track"><span class="switch-thumb"></span></span>
              </span>
            </label>

            <div class="random-color-targets">
              <div class="random-color-target">
                <h3>時計色</h3>
                <div class="range-pair">
                  <label>色相 <output id="setting-random-clock-hue-value"></output></label>
                  <div class="range-row">
                    <input id="setting-random-clock-hue-min" type="range" min="0" max="360" step="1" aria-label="時計色の色相下限" />
                    <input id="setting-random-clock-hue-max" type="range" min="0" max="360" step="1" aria-label="時計色の色相上限" />
                  </div>
                </div>
                <div class="range-pair">
                  <label>明度 <output id="setting-random-clock-lightness-value"></output></label>
                  <div class="range-row">
                    <input id="setting-random-clock-lightness-min" type="range" min="0" max="100" step="1" aria-label="時計色の明度下限" />
                    <input id="setting-random-clock-lightness-max" type="range" min="0" max="100" step="1" aria-label="時計色の明度上限" />
                  </div>
                </div>
              </div>

              <div class="random-color-target">
                <h3>文字色</h3>
                <div class="range-pair">
                  <label>色相 <output id="setting-random-text-hue-value"></output></label>
                  <div class="range-row">
                    <input id="setting-random-text-hue-min" type="range" min="0" max="360" step="1" aria-label="文字色の色相下限" />
                    <input id="setting-random-text-hue-max" type="range" min="0" max="360" step="1" aria-label="文字色の色相上限" />
                  </div>
                </div>
                <div class="range-pair">
                  <label>明度 <output id="setting-random-text-lightness-value"></output></label>
                  <div class="range-row">
                    <input id="setting-random-text-lightness-min" type="range" min="0" max="100" step="1" aria-label="文字色の明度下限" />
                    <input id="setting-random-text-lightness-max" type="range" min="0" max="100" step="1" aria-label="文字色の明度上限" />
                  </div>
                </div>
              </div>

              <div class="random-color-target">
                <h3>背景色</h3>
                <div class="range-pair">
                  <label>色相 <output id="setting-random-background-hue-value"></output></label>
                  <div class="range-row">
                    <input id="setting-random-background-hue-min" type="range" min="0" max="360" step="1" aria-label="背景色の色相下限" />
                    <input id="setting-random-background-hue-max" type="range" min="0" max="360" step="1" aria-label="背景色の色相上限" />
                  </div>
                </div>
                <div class="range-pair">
                  <label>明度 <output id="setting-random-background-lightness-value"></output></label>
                  <div class="range-row">
                    <input id="setting-random-background-lightness-min" type="range" min="0" max="100" step="1" aria-label="背景色の明度下限" />
                    <input id="setting-random-background-lightness-max" type="range" min="0" max="100" step="1" aria-label="背景色の明度上限" />
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="settings-section">
            <h2>その他</h2>

            <div class="action-column">
              <button id="settings-copy-url" class="action-button" type="button">
                URLコピー
              </button>
              <button id="settings-reset" class="action-button action-button-danger" type="button">
                初期化
              </button>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5.5.2/dist/iro.min.js"></script>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
