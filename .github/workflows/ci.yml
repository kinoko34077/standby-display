name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Temporary on #50 only: materialize the lockfile for the supported Wrangler
      # upgrade in CI, then replace this step with normal npm ci after the artifact
      # has been committed to the branch.
      - run: cp package-lock.json /tmp/standby-lock-before.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Emit temporary lockfile patch
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const before = JSON.parse(readFileSync("/tmp/standby-lock-before.json", "utf8"));
          const after = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const changed = {};
          for (const [key, value] of Object.entries(after.packages)) {
            if (JSON.stringify(before.packages[key]) !== JSON.stringify(value)) {
              changed[key] = value;
            }
          }
          const removed = Object.keys(before.packages).filter(key => !(key in after.packages));
          const patch = { changed, removed, lockfileVersion: after.lockfileVersion };
          console.log("LOCK_CHANGE_START" + JSON.stringify(patch) + "LOCK_CHANGE_END");
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock-audit-remediation
          path: package-lock.json
          if-no-files-found: error
      - run: npm ci
      - run: npm run verify
      - run: npm run test:browser
      - run: npx wrangler deploy --dry-run
